<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#fdf5f2" />
      <stop offset="100%" stop-color="#efd3c6" />
    </radialGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#ba5b3a" flood-opacity="0.2"/>
    </filter>

    <!-- Reusable Rounded Squares -->
    <rect id="sq-outline-dark" width="150" height="150" rx="35" fill="none" stroke="#ba5b3a" stroke-width="12" />
    <rect id="sq-outline-light" width="150" height="150" rx="35" fill="none" stroke="#d98d71" stroke-width="10" />
    <rect id="sq-fill-trans" width="150" height="150" rx="35" fill="#d98d71" opacity="0.15" />
    
    <!-- White glowing square -->
    <rect id="sq-white-glow" width="150" height="150" rx="35" fill="#ffffff" filter="url(#shadow)" />
    <!-- Adding inner white to overlay the shadow cleanly -->
    <rect id="sq-white" width="150" height="150" rx="35" fill="#ffffff" />

    <!-- Exact House Logo (Terracotta) -->
    <!-- The path is drawn on a 100x100 grid. Translating by (25, 22.5) centers it in the 150x150 box -->
    <g id="house-logo" transform="translate(25, 22.5)">
      <path d="M 20 90 L 20 60 L 5 60 L 28 37 L 28 15 L 40 15 L 40 25 L 50 15 L 95 60 L 80 60 L 80 90 L 60 90 L 60 53 L 50 43 L 40 53 L 40 90 Z" fill="#ba5b3a" />
    </g>

    <!-- Complete Highlighted Box -->
    <g id="box-highlighted">
      <use href="#sq-white-glow" />
      <use href="#sq-white" />
      <use href="#house-logo" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- TOP LEFT CLUSTER -->
  <g>
    <!-- Row 1 -->
    <use href="#box-highlighted" x="40" y="40" />
    <use href="#sq-outline-dark" x="220" y="40" />
    <use href="#sq-outline-light" x="400" y="40" />
    <use href="#sq-fill-trans" x="400" y="40" />
    <use href="#sq-fill-trans" x="580" y="40" />

    <!-- Row 2 -->
    <use href="#sq-outline-dark" x="40" y="220" />
    <use href="#sq-outline-light" x="220" y="220" />
    <use href="#sq-fill-trans" x="400" y="220" />

    <!-- Row 3 -->
    <use href="#sq-outline-light" x="40" y="400" />
    <use href="#sq-fill-trans" x="40" y="400" />
    <use href="#sq-outline-dark" x="220" y="400" />
  </g>

  <!-- BOTTOM RIGHT CLUSTER -->
  <g>
    <!-- Row 1 (Topmost of this group) -->
    <use href="#sq-outline-dark" x="1550" y="530" />
    <use href="#sq-fill-trans" x="1730" y="530" />
    <use href="#sq-outline-light" x="1730" y="530" />

    <!-- Row 2 -->
    <use href="#sq-fill-trans" x="1370" y="710" />
    <use href="#sq-outline-light" x="1550" y="710" />
    <use href="#sq-outline-dark" x="1730" y="710" />

    <!-- Row 3 (Bottommost) -->
    <use href="#sq-fill-trans" x="1190" y="890" />
    <use href="#sq-outline-light" x="1370" y="890" />
    <use href="#sq-fill-trans" x="1370" y="890" />
    <use href="#sq-outline-dark" x="1550" y="890" />
    <use href="#box-highlighted" x="1730" y="890" />
  </g>
</svg>
