<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para dar o efeito tátil da imagem original -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    
    <!-- Gradiente recriando a cor terracota/laranja -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6B46" />
      <stop offset="100%" stop-color="#C0502E" />
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado (Squircle) do Ícone -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#bg-grad)" filter="url(#soft-shadow)"/>

  <!-- Silhueta da Casa (Vazada/Branca) -->
  <path d="M 82 145
           L 82 92
           L 100 74
           L 118 92
           L 118 145
           L 136 145
           L 136 102
           L 148 102
           L 100 54
           L 82 72
           L 82 54
           L 64 54
           L 64 90
           L 52 102
           L 64 102
           L 64 145 Z"
        fill="#FFFFFF"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linejoin="round" />

  <!-- Texto Principal: habitou -->
  <text x="210" y="115" font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="76" font-weight="800" fill="#2D2D2D" letter-spacing="-2">habitou</text>

  <!-- Texto Secundário: IMÓVEIS -->
  <text x="215" y="152" font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#C0502E" letter-spacing="8">IMÓVEIS</text>
</svg>
